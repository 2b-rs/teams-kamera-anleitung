name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site from github-upload.zip
        run: |
          mkdir -p _unz _site
          unzip -q github-upload.zip -d _unz
          cp -R _unz/teams-kamera-anleitung/. _site/
          touch _site/.nojekyll
      - name: Add logo slots, logos and newer PDF from the repo
        run: |
          if [ -f logos.js ]; then cp logos.js _site/ && sed -i 's#</body>#<script src="logos.js"></script></body>#' _site/index.html; fi
          if [ -d logos ]; then cp -R logos _site/; fi
          if [ -f quickstart.pdf ]; then cp quickstart.pdf _site/quickstart.pdf; fi
          ls -R _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
